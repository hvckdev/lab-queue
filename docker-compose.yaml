name: lab-queue

x-service: &service
  restart: unless-stopped
  init: true
  stop_grace_period: 15s

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_demo_password}
      POSTGRES_DB: postgres
      ACCOUNTS_DB_PASSWORD: ${ACCOUNTS_DB_PASSWORD:-accounts_demo_password}
      QUEUE_DB_PASSWORD: ${QUEUE_DB_PASSWORD:-queue_demo_password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/init-databases.sql:/docker-entrypoint-initdb.d/10-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

  accounts:
    <<: *service
    build:
      context: .
      dockerfile: projects/accounts/Dockerfile
    environment:
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://labqueue_accounts@postgres:5432/accounts?sslmode=disable
      PGPASSWORD: ${ACCOUNTS_DB_PASSWORD:-accounts_demo_password}
      JWT_SECRET: ${JWT_SECRET:-labqueue-demo-secret-change-before-publishing-2026}
    depends_on:
      postgres:
        condition: service_healthy

  queue:
    <<: *service
    build:
      context: .
      dockerfile: projects/queue/Dockerfile
    environment:
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://labqueue_queue@postgres:5432/queue?sslmode=disable
      PGPASSWORD: ${QUEUE_DB_PASSWORD:-queue_demo_password}
      JWT_SECRET: ${JWT_SECRET:-labqueue-demo-secret-change-before-publishing-2026}
      ACCOUNTS_URL: http://accounts:8080
    depends_on:
      postgres:
        condition: service_healthy
      accounts:
        condition: service_healthy

  web:
    <<: *service
    build:
      context: .
      dockerfile: projects/web/Dockerfile
    environment:
      HTTP_ADDR: :8080
      ACCOUNTS_URL: http://accounts:8080
      QUEUE_URL: http://queue:8080
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    depends_on:
      accounts:
        condition: service_healthy
      queue:
        condition: service_healthy

volumes:
  postgres-data:
